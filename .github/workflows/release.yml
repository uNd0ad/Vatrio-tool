name: "Release Desktop App"

on:
  push:
    tags:
      - 'v*'

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Resolve signing key
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          ALLOW_UNSIGNED: ${{ vars.ALLOW_UNSIGNED_RELEASE }}
        run: |
          # Collapse to a single line so the base64 key is valid inside $GITHUB_ENV.
          CLEAN_KEY=$(printf '%s' "$SIGNING_KEY" | tr -d '\r\n')
          if [ -n "$CLEAN_KEY" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY=$CLEAN_KEY" >> "$GITHUB_ENV"
            echo "Signing key present — producing signed, updater-enabled artifacts."
          elif [ "$ALLOW_UNSIGNED" = "true" ]; then
            # Deliberate unsigned build (repo variable ALLOW_UNSIGNED_RELEASE=true).
            # Strips the updater so we don't publish a release the updater endpoint
            # would then serve without a valid signature.
            echo "::warning::Building an UNSIGNED release (ALLOW_UNSIGNED_RELEASE=true). The auto-updater is disabled for this build; installed clients will NOT receive it as an update."
            node -e '
              const fs = require("fs");
              const p = "src-tauri/tauri.conf.json";
              const conf = JSON.parse(fs.readFileSync(p, "utf8"));
              if (conf.plugins && conf.plugins.updater) delete conf.plugins.updater;
              if (conf.bundle) conf.bundle.createUpdaterArtifacts = false;
              fs.writeFileSync(p, JSON.stringify(conf, null, 2) + "\n");
            '
          else
            # Fail loudly rather than silently shipping an unsigned release that
            # would break auto-updates for every installed client (the updater
            # endpoint would 404 on latest.json).
            echo "::error::TAURI_SIGNING_PRIVATE_KEY secret is missing. Releasing now would publish UNSIGNED binaries and break the auto-updater for all installed clients. Set the secret to sign, or set repository variable ALLOW_UNSIGNED_RELEASE=true to intentionally publish an unsigned build."
            exit 1
          fi

      - name: Build and Publish Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ env.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'Vatrio Tool v__VERSION__'
          releaseBody: 'Vatrio Property CRM Desktop Application release v__VERSION__.'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
