name: "Release Desktop App"

on:
  push:
    tags:
      - 'v*'

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Sanitize Signing Key
        shell: bash
        run: |
          CLEAN_KEY=$(echo -n "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" | tr -d '\r\n')
          if [ -n "$CLEAN_KEY" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY=$CLEAN_KEY" >> $GITHUB_ENV
          else
            echo "No TAURI_SIGNING_PRIVATE_KEY secret found; stripping updater pubkey to allow unsigned binary release..."
            node -e '
              const fs = require("fs");
              const conf = JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json", "utf8"));
              if (conf.plugins?.updater) delete conf.plugins.updater;
              if (conf.bundle) conf.bundle.createUpdaterArtifacts = false;
              fs.writeFileSync("src-tauri/tauri.conf.json", JSON.stringify(conf, null, 2));
            '
          fi

      - name: Build and Publish Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ env.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: v__VERSION__
          releaseName: 'Vatrio Tool v__VERSION__'
          releaseBody: 'Vatrio Property CRM Desktop Application release v__VERSION__.'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
