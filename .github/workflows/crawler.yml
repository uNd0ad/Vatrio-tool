name: Run Real Estate Crawler

on:
  schedule:
    # Run every 6 hours (at minute 0 of hours 0, 6, 12, and 18 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manually triggering the crawler from the GitHub Actions UI

jobs:
  scrape:
    name: Run Scrapers
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Fără secrete scraperul pică oricum, dar abia după ce se instalează
      # Chromium — două minute pierdute și un stack trace în loc de un motiv.
      - name: Check required secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          missing=""
          [ -z "$SUPABASE_URL" ] && missing="$missing SUPABASE_URL"
          [ -z "$SUPABASE_SERVICE_ROLE_KEY" ] && missing="$missing SUPABASE_SERVICE_ROLE_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Lipsesc secretele de repository:$missing"
            echo "Adaugă-le în Settings → Secrets and variables → Actions → New repository secret."
            echo "Valorile sunt în Supabase → Project Settings → API (service_role, nu anon)."
            exit 1
          fi
          echo "Secretele Supabase sunt configurate."

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: crawler/package-lock.json

      - name: Install Dependencies
        run: |
          cd crawler
          npm ci

      - name: Install Playwright Chromium & OS Dependencies
        run: |
          cd crawler
          npx playwright install --with-deps chromium

      - name: Test and type-check crawler
        run: |
          cd crawler
          npm test
          npm run build

      - name: Run Scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CRAWLER_HEARTBEAT_URL: ${{ secrets.CRAWLER_HEARTBEAT_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CRAWLER_SUMMARY_EMAIL_TO: ${{ secrets.CRAWLER_SUMMARY_EMAIL_TO }}
          CRAWLER_SUMMARY_EMAIL_FROM: ${{ secrets.CRAWLER_SUMMARY_EMAIL_FROM }}
        run: |
          cd crawler
          npm start
